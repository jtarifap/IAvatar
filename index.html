<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paseta</title>

    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paseta">

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/x-icon" href="/images/paseta.ico">
    <link rel="icon" type="image/png" href="/images/paseta-icono.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=M+PLUS+Rounded+1c:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        /* Barras de scroll finas siempre visibles (ayuda, historial) */
        .paseta-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(128, 128, 128, 0.65) transparent;
        }

        .paseta-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .paseta-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .paseta-scroll::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.65);
            border-radius: 4px;
        }

        /* Desplegables siempre legibles (el popup nativo
           ignora el fondo translúcido del panel) */
        #ia-voice option,
        #ia-model option,
        #ia-provider option,
        #ia-speaker option {
            color: #111827;
            background-color: #ffffff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
